{{ define "main" }}

<!-- Thanks Hero Section -->
<section class="relative bg-brand-light overflow-hidden flex items-center justify-center min-h-[85vh] py-32 md:py-40">
  <!-- Top spacer for fixed header -->
  <div class="h-32 md:h-48 w-full absolute top-0 pointer-events-none"></div>

  <!-- Subtle decorative elements -->
  <div class="absolute top-0 right-0 w-1/2 h-full bg-gradient-to-l from-brand-primary/10 to-transparent skew-x-12 translate-x-1/4 pointer-events-none"></div>
  <div class="absolute bottom-0 left-0 w-1/2 h-full bg-gradient-to-r from-brand-primary/10 to-transparent -skew-x-12 -translate-x-1/4 pointer-events-none"></div>
  
  <div class="max-w-[1400px] mx-auto px-6 md:px-12 relative z-10 w-full pt-16 md:pt-0">
    <div class="max-w-4xl mx-auto text-center">
      <div class="overflow-hidden mb-8">
        <span class="block text-[10px] md:text-xs font-bold uppercase tracking-[0.6em] text-brand-primary animate-reveal">
          {{ .Title }}
        </span>
      </div>
      <h1 class="text-4xl sm:text-6xl md:text-8xl lg:text-9xl font-serif text-brand-dark tracking-tighter leading-[1.1] md:leading-[0.9] text-wrap animate-reveal">
        {{ .Params.heading | markdownify }}
      </h1>
      
      <div class="mt-12 md:mt-16 max-w-2xl mx-auto">
        <p class="text-lg md:text-2xl font-serif text-brand-dark/70 leading-relaxed italic animate-reveal" style="animation-delay: 200ms">
          {{ .Params.description | markdownify }}
        </p>
      </div>

      <div class="mt-16 md:mt-24 flex flex-col sm:flex-row items-center justify-center gap-6 md:gap-8 animate-reveal" style="animation-delay: 400ms">
        <div class="magnetic-wrap">
          <a href="{{ site.Home.Permalink }}" class="inline-block px-10 py-5 bg-brand-dark hover:bg-brand-primary !text-white text-[11px] font-bold uppercase tracking-[0.3em] rounded-full transition-all duration-500 hover:shadow-[0_20px_50px_rgba(225,29,72,0.3)] min-w-[220px]">
            Return Home
          </a>
        </div>
        <div class="magnetic-wrap">
          <a href="https://instagram.com/andremoreno" target="_blank" class="inline-block px-10 py-5 bg-white border border-brand-dark/10 hover:border-brand-primary hover:!text-white hover:bg-brand-primary text-brand-dark text-[11px] font-bold uppercase tracking-[0.3em] rounded-full transition-all duration-500 min-w-[220px]">
            Instagram
          </a>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Visual Section -->
<section class="py-20 md:py-40 bg-white">
  <div class="max-w-[1200px] mx-auto px-6 md:px-12">
    <div class="relative rounded-[2rem] md:rounded-[3rem] overflow-hidden aspect-[16/9] md:aspect-[21/9] group bg-gray-100 shadow-2xl shadow-black/5 animate-reveal" style="animation-delay: 600ms">
       <img src="{{ "images/thank-you.webp" | absURL }}" 
            alt="Thank you" 
            class="w-full h-full object-cover transition-transform duration-[3s] group-hover:scale-110">
       <div class="absolute inset-x-0 bottom-0 p-8 md:p-12 bg-gradient-to-t from-brand-dark/70 via-brand-dark/20 to-transparent flex flex-col justify-end">
          <p class="text-[9px] font-bold uppercase tracking-[0.4em] text-white/70">A Moment of Gratitude</p>
       </div>
    </div>
  </div>
</section>

{{ if .Site.Params.call_to_action.enable }}
{{ partial "call-to-action.html" . }}
{{ end }}

<script>
  // Magnetic Effect
  document.querySelectorAll('.magnetic-wrap').forEach(wrap => {
    wrap.addEventListener('mousemove', (e) => {
      const rect = wrap.getBoundingClientRect();
      const x = e.clientX - rect.left - rect.width / 2;
      const y = e.clientY - rect.top - rect.height / 2;
      wrap.style.transform = `translate(${x * 0.3}px, ${y * 0.3}px)`;
    });
    wrap.addEventListener('mouseleave', () => {
      wrap.style.transform = `translate(0, 0)`;
    });
  });
</script>

{{ end }}
