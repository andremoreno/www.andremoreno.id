{{ define "main" }}
<div id="not-found-page" class="bg-brand-light relative min-h-screen overflow-hidden">
  
  {{ with .Site.Params.notFound }}
  <section class="min-h-screen flex items-center justify-center relative z-10 py-32 md:py-48">
    
    <!-- Subtle Background Decal -->
    <div class="absolute inset-0 z-0 pointer-events-none opacity-[0.04] select-none flex items-center justify-center overflow-hidden">
      <span class="text-[55vw] font-serif font-black tracking-tighter leading-none translate-y-20 transform-gpu text-brand-dark">404</span>
    </div>

    <div class="max-w-[1400px] mx-auto px-6 md:px-12 relative z-20 w-full">
      <div class="flex flex-col items-center text-center">
        
        <!-- Category Label -->
        <div class="overflow-hidden mb-10">
          <span class="block text-[10px] md:text-xs font-bold uppercase tracking-[0.6em] text-brand-primary animate-reveal">
            System Message: Path Unattainable
          </span>
        </div>

        <!-- Main Title -->
        <div class="overflow-hidden mb-12">
          <h1 class="text-8xl md:text-[12rem] lg:text-[15rem] font-serif text-brand-dark tracking-tighter leading-none animate-reveal" style="animation-delay: 200ms;">
            {{ .title | default "404" }}
          </h1>
        </div>

        <!-- Philosophical Quote -->
        <div class="max-w-3xl mx-auto mb-24 md:mb-36 opacity-0 animate-reveal" style="animation-delay: 400ms;">
          <div class="h-[1px] bg-brand-dark/10 w-24 mx-auto mb-12 animate-line" style="animation-delay: 600ms;"></div>
          
          <p class="text-xl md:text-3xl lg:text-4xl leading-[1.5] text-brand-dark/80 text-balance italic font-serif">
            "{{ .heading }}"
          </p>
          
          <div class="mt-12 flex flex-col items-center gap-4 animate-reveal" style="animation-delay: 800ms;">
             <p class="text-[10px] font-bold uppercase tracking-[0.5em] text-brand-dark/30">
              — Perspective changes everything —
            </p>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex flex-col sm:flex-row items-center gap-12 md:gap-16 opacity-0 animate-reveal" style="animation-delay: 1000ms;">
          <div class="magnetic-wrap">
            <a href="{{ site.Home.Permalink }}" class="group relative px-16 py-8 bg-brand-dark !text-white hover:bg-brand-primary text-[11px] font-bold uppercase tracking-[0.4em] rounded-full transition-all duration-700 hover:shadow-[0_20px_60px_rgba(225,29,72,0.3)] transform hover:-translate-y-1 block overflow-hidden">
               <span class="relative z-10">Return to Safety</span>
               <div class="absolute inset-0 bg-white/10 translate-y-full group-hover:translate-y-0 transition-transform duration-500 ease-out"></div>
            </a>
          </div>
          
          <a href="{{ "stories/" | absURL }}" class="group flex items-center gap-6 text-[11px] font-bold uppercase tracking-[0.4em] text-brand-dark hover:text-brand-primary transition-all duration-700 leading-none">
            Gallery Stories
            <span class="w-12 h-[1px] bg-brand-dark/20 group-hover:w-20 group-hover:bg-brand-primary transition-all duration-700"></span>
          </a>
        </div>

      </div>
    </div>
  </section>
  {{ end }}
</div>

<script>
  // Magnetic Effect for the buttons
  document.querySelectorAll('.magnetic-wrap').forEach(wrap => {
    wrap.addEventListener('mousemove', (e) => {
      const rect = wrap.getBoundingClientRect();
      const x = e.clientX - rect.left - rect.width / 2;
      const y = e.clientY - rect.top - rect.height / 2;
      wrap.style.transform = `translate(${x * 0.3}px, ${y * 0.3}px)`;
    });
    wrap.addEventListener('mouseleave', () => {
      wrap.style.transform = `translate(0, 0)`;
    });
  });
</script>
{{ end }}
